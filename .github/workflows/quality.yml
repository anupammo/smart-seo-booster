name: Quality

# The plugin's runtime code lives in smart-seo-booster/trunk (the SVN working
# copy), not at the repository root — every job below accounts for that.
on:
  push:
    branches: ['**']
    paths:
      - 'smart-seo-booster/trunk/**'
      - '.github/workflows/quality.yml'
  pull_request:
    paths:
      - 'smart-seo-booster/trunk/**'
      - '.github/workflows/quality.yml'
  workflow_dispatch:

jobs:
  lint:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Matches "Requires PHP: 7.4" in the plugin header through current.
        php: ['7.4', '8.0', '8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint every PHP file
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r -d '' file; do
            if ! php -l "$file" > /dev/null 2>&1; then
              echo "::error file=$file::PHP ${{ matrix.php }} syntax error"
              php -l "$file" || true
              fail=1
            fi
          done < <(find smart-seo-booster/trunk -name '*.php' -print0)
          exit "$fail"

  plugin-check:
    name: WordPress Plugin Check
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, zip
          coverage: none

      - name: Install WP-CLI
        run: |
          curl -sSLo wp-cli.phar https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x wp-cli.phar
          sudo mv wp-cli.phar /usr/local/bin/wp

      - name: Install WordPress
        run: |
          set -euo pipefail
          wp core download --path=wp --version=latest --skip-content
          wp core config --path=wp --dbname=wordpress --dbuser=root --dbpass=root \
            --dbhost=127.0.0.1:3306 --skip-check
          wp core install --path=wp --url=http://localhost --title=CI \
            --admin_user=admin --admin_password=admin --admin_email=ci@example.com --skip-email

      - name: Install the plugin and Plugin Check
        run: |
          set -euo pipefail
          cp -r smart-seo-booster/trunk wp/wp-content/plugins/smart-seo-booster
          wp plugin install plugin-check --activate --path=wp
          # Activation must succeed on a clean install — a fatal here is the
          # single worst thing that can reach users.
          wp plugin activate smart-seo-booster --path=wp

      - name: Run Plugin Check
        run: |
          set -euo pipefail
          # `wp plugin check` exits 0 even when it reports ERRORs (verified —
          # this is true of --format=strict-json too), so the exit code cannot
          # be trusted. Parse the report instead.
          wp plugin check smart-seo-booster --path=wp --format=json \
            --include-experimental \
            --include-low-severity-errors \
            --include-low-severity-warnings \
            > report.txt 2>&1 || true

          cat report.txt

          if grep -q '"type":"\(ERROR\|WARNING\)"' report.txt; then
            echo "::error::Plugin Check reported errors or warnings (see the report above)."
            exit 1
          fi
          echo "Plugin Check is clean."

      - name: Check for PHP notices during a front-end request
        run: |
          set -euo pipefail
          wp config set WP_DEBUG true --raw --path=wp
          wp config set WP_DEBUG_LOG true --raw --path=wp
          wp config set WP_DEBUG_DISPLAY false --raw --path=wp
          wp eval 'echo "bootstrapped\n";' --path=wp

          LOG=wp/wp-content/debug.log
          if [ -s "$LOG" ]; then
            echo "::error::PHP notices/warnings were logged:"
            cat "$LOG"
            exit 1
          fi
          echo "No PHP notices logged."
