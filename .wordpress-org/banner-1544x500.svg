<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1544 500" width="1544" height="500" role="img" aria-label="Smart SEO Booster">
  <defs>
    <linearGradient id="bBg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#17347f"/>
      <stop offset="1" stop-color="#2b6fe0"/>
    </linearGradient>
    <linearGradient id="bSwoosh" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#16a34a"/>
      <stop offset="1" stop-color="#4ade80"/>
    </linearGradient>
  </defs>

  <rect width="1544" height="500" fill="url(#bBg)"/>

  <!-- badge -->
  <circle cx="270" cy="250" r="196" fill="#2563eb"/>
  <circle cx="270" cy="250" r="188" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="4"/>

  <!-- rocket + swoosh (icon motif scaled into the badge) -->
  <g transform="translate(270 258) scale(1.42) translate(-128 -128)">
    <path d="M40 175 Q124 108 212 70" fill="none" stroke="url(#bSwoosh)" stroke-width="18" stroke-linecap="round"/>
    <path d="M217 67 L188 103 L172 63 Z" fill="#4ade80"/>
    <path d="M112 150 L98 176 L112 171 Z" fill="#cbd5e1"/>
    <path d="M144 150 L158 176 L144 171 Z" fill="#cbd5e1"/>
    <ellipse cx="128" cy="186" rx="17" ry="12" fill="#f97316"/>
    <ellipse cx="128" cy="183" rx="9" ry="8" fill="#fbbf24"/>
    <path d="M128 72 L112 106 L112 170 Q112 178 120 178 L136 178 Q144 178 144 170 L144 106 Z" fill="#ffffff"/>
    <circle cx="128" cy="112" r="13" fill="#1d4ed8"/>
  </g>

  <!-- wordmark -->
  <text x="548" y="288" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="130" font-weight="700">
    <tspan fill="#ffffff">Smart </tspan><tspan fill="#4ade80">SEO</tspan><tspan fill="#ffffff"> Booster</tspan>
  </text>
  <text x="552" y="356" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="40" fill="#cfe0ff">Lightweight, complete WordPress SEO — audit, sitemaps, schema &amp; more</text>
</svg>
